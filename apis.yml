name: Tiebaobei
description: 'Tiebaobei (铁甲二手机) is a used construction-machinery C2C trading platform
  operated by Beijing Tiejialong Technology Co., Ltd. (北京铁甲龙科技有限公司). Founded in 2009 out of
  the Tiebaobei (Cehome) construction-equipment forum, it lets individuals buy and sell used
  excavators, loaders, bulldozers, cranes, rotary drills and other heavy equipment, backed by a
  network of ~400 regional "city manager" brokers across 30 Chinese provinces who verify and
  co-inspect machines. The platform layers industry news, equipment inspection/detection, price
  rankings and financing services on top of the marketplace. It raised A financing from Qiming
  Venture Partners, a DCM-led Series B (¥100M, 2015) and a Yuansheng-led Series C (¥200M, 2016).
  This profile was enriched by the API Evangelist pipeline; no public developer API or open
  platform was found.'
